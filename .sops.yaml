# Secrets are encrypted to a single personal age key (not a host key), so the same
# config deploys to any machine that has the private key at /var/lib/sops-nix/key.txt.
# The private key also lives in ~/.config/sops/age/keys.txt for editing, and in 1Password.
keys:
  - &julius age1lsprdj65jqzkm27vlufj8mrw6xkdm8xd7qa3nn62dzcnyhdlv9ys8ppa73
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *julius
